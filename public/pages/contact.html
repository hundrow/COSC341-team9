<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Redolent Fragrances</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <nav>
        <a href="../index.html" class="logo">Redolent Fragrances</a>
        <ul class="nav-links">
          <li><a href="../index.html">Home</a></li>
          <li><a href="./shop.html">Shop</a></li>
          <li><a href="./blog.html">Blog</a></li>
          <li><a href="./about.html">About</a></li>
          <li><a href="./contact.html">Contact</a></li>
        </ul>
        <div class="nav-actions">
          <a href="./cart.html" class="cart-icon">Cart (<span id="cart-count">0</span>)</a>
          <a href="./account.html" class="user-icon">Account</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="contact-page">
    <div class="container">
      <h1>Contact Us</h1>
      <form id="contact-form" class="contact-form">
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Your Email" required>
        <textarea name="message" placeholder="Your Message" rows="6" required></textarea>
        <button type="submit" class="btn btn-primary">Send Message</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2025 Redolent Fragrances. All rights reserved.</p>
  </footer>

  <script src="../js/utils/cart.js"></script>
</body>
</html>

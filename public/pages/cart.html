<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - Redolent Fragrances</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <nav>
        <a href="../index.html" class="logo">Redolent Fragrances</a>
        <ul class="nav-links">
          <li><a href="../index.html">Home</a></li>
          <li><a href="./shop.html">Shop</a></li>
          <li><a href="./customizer.html">Customize</a></li>
          <li><a href="./blog.html">Blog</a></li>
          <li><a href="./about.html">About</a></li>
          <li><a href="./contact.html">Contact</a></li>
        </ul>
        <div class="nav-actions">
          <a href="./cart.html" class="cart-icon">Cart (<span id="cart-count">0</span>)</a>
          <a href="./account.html" class="user-icon">Account</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="cart-page">
    <div class="container">
      <h1>Shopping Cart</h1>
      <div id="cart-items" class="cart-items">
        <!-- Cart items will be rendered here by JS -->
      </div>
      <div class="cart-summary">
        <p>Subtotal: <span id="cart-subtotal">$0.00</span></p>
        <a href="./checkout.html" class="btn btn-primary">Proceed to Checkout</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2025 Redolent Fragrances. All rights reserved.</p>
  </footer>

  <script src="../js/utils/cart.js"></script>
  <script src="../js/components/cart-page.js"></script>
</body>
</html>

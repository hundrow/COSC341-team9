<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shop — Redolent Fragrances</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div id="site-header"></div>

  <main style="padding:1rem;">
    <h1>Shop Fragrances</h1>
    <div id="filters" style="margin-bottom:1rem;">
      <label>Sort: <select id="sort-select"><option value="featured">Featured</option><option value="price_asc">Price: Low → High</option><option value="price_desc">Price: High → Low</option></select></label>
    </div>

    <div id="product-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px"></div>
  </main>

  <script defer src="../js/utils/cart.js"></script>
  <script defer src="../js/utils/header.js"></script>
  <script defer src="../js/utils/shop.js"></script>
</body>
</html>

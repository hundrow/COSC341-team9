<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Perfume bottle on autumn leaves beside a river</title>
  <desc id="desc">A stylized vector illustration of a pink glass perfume bottle resting on orange and red autumn leaves on the riverbank, with a calm blue river and soft hills under a warm sky.</desc>
  <defs>
    <!-- Gradients -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7ecd8"/>
      <stop offset="55%" stop-color="#f0d8b0"/>
      <stop offset="100%" stop-color="#d3a16b"/>
    </linearGradient>
    <linearGradient id="riverGrad" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#cfe3f3"/>
      <stop offset="60%" stop-color="#8cc2e0"/>
      <stop offset="100%" stop-color="#6eaad3"/>
    </linearGradient>
    <linearGradient id="bottleBodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbe6ef"/>
      <stop offset="60%" stop-color="#f3c1d4"/>
      <stop offset="100%" stop-color="#e7a8bf"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2b9b3"/>
      <stop offset="100%" stop-color="#9e9490"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaf7"/>
      <stop offset="100%" stop-color="#f6ede9"/>
    </linearGradient>
    <linearGradient id="leafRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d74b4b"/>
      <stop offset="100%" stop-color="#8e2c2c"/>
    </linearGradient>
    <linearGradient id="leafOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f39b3c"/>
      <stop offset="100%" stop-color="#b35a14"/>
    </linearGradient>
    <linearGradient id="leafYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3d34a"/>
      <stop offset="100%" stop-color="#b08b1e"/>
    </linearGradient>
    <radialGradient id="glassHighlight" cx="0.35" cy="0.2" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Shadows -->
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="groundBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <!-- Simple leaf path -->
    <symbol id="leaf" viewBox="0 0 200 120">
      <path d="M10,60 C40,10 160,10 190,60 C160,110 40,110 10,60 Z" fill="url(#leafOrange)"/>
      <path d="M20,60 C50,30 150,30 180,60" fill="none" stroke="#6e2b00" stroke-width="4" stroke-linecap="round" stroke-opacity="0.35"/>
      <path d="M60,52 L80,40 M120,52 L140,40 M90,68 L110,84" stroke="#6e2b00" stroke-width="3" stroke-linecap="round" stroke-opacity="0.28"/>
    </symbol>
  </defs>

  <!-- Background sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#skyGrad)"/>

  <!-- Distant hills -->
  <path d="M0,520 C200,460 360,520 560,500 C760,480 940,520 1100,500 C1300,470 1450,500 1600,520 L1600,900 L0,900 Z" fill="#c9b28f" opacity="0.4"/>
  <path d="M0,560 C240,520 380,560 540,540 C800,510 980,560 1200,540 C1420,520 1540,540 1600,560 L1600,900 L0,900 Z" fill="#af9a79" opacity="0.45"/>

  <!-- River -->
  <path d="M0,620 C220,600 380,640 520,640 C700,640 880,580 1040,590 C1220,600 1400,650 1600,640 L1600,900 L0,900 Z" fill="url(#riverGrad)"/>
  <!-- River gentle waves -->
  <g opacity="0.25" stroke="#ffffff" stroke-width="3" fill="none">
    <path d="M120,700 C220,690 320,705 420,700"/>
    <path d="M300,740 C420,730 540,750 660,740"/>
    <path d="M600,710 C740,700 880,720 1020,710"/>
    <path d="M920,750 C1060,740 1200,760 1340,750"/>
  </g>

  <!-- Foreground ground/riverbank -->
  <path d="M0,700 C200,720 380,760 560,770 C740,780 980,770 1160,760 C1340,750 1480,720 1600,710 L1600,900 L0,900 Z" fill="#b8743a" opacity="0.45" filter="url(#groundBlur)"/>

  <!-- Leaves cluster under bottle -->
  <g transform="translate(640,740) rotate(-6)">
    <use href="#leaf" width="260" height="160" transform="translate(-300,0) rotate(-8)"/>
    <use href="#leaf" width="220" height="140" transform="translate(-120,10) rotate(12)"/>
    <use href="#leaf" width="240" height="150" transform="translate(60,-10) rotate(-6)"/>
  </g>
  <g transform="translate(820,760) rotate(8)">
    <use href="#leaf" width="220" height="140" transform="translate(-160,-40) rotate(6)"/>
    <use href="#leaf" width="200" height="130" transform="translate(0,-20) rotate(-10)"/>
  </g>
  <!-- Recolor some leaves -->
  <g opacity="0.9">
    <path d="M380,820 C420,770 580,770 620,820 C580,870 420,870 380,820 Z" fill="url(#leafRed)"/>
    <path d="M1080,820 C1120,770 1280,770 1320,820 C1280,870 1120,870 1080,820 Z" fill="url(#leafYellow)"/>
  </g>

  <!-- Bottle shadow -->
  <ellipse cx="800" cy="760" rx="140" ry="26" fill="#000" opacity="0.25" filter="url(#softBlur)"/>

  <!-- Perfume bottle group -->
  <g transform="translate(670,530)">
    <!-- Neck -->
    <rect x="70" y="18" width="120" height="40" rx="10" fill="#efe6e1" stroke="#c7bdb8" stroke-width="3"/>
    <!-- Cap -->
    <rect x="60" y="-36" width="140" height="56" rx="10" fill="url(#capGrad)" stroke="#7a6f6a" stroke-width="3"/>
    <!-- Atomizer button hint -->
    <circle cx="130" cy="-10" r="10" fill="#8a807b" opacity="0.6"/>

    <!-- Bottle body (rounded rectangle) -->
    <rect x="0" y="40" width="260" height="240" rx="40" fill="url(#bottleBodyGrad)" stroke="#a5798c" stroke-width="4"/>
    <!-- Inner glass rim -->
    <rect x="18" y="58" width="224" height="204" rx="32" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3"/>

    <!-- Label -->
    <rect x="52" y="132" width="156" height="84" rx="14" fill="url(#labelGrad)" stroke="#d0c4be" stroke-width="2"/>
    <text x="130" y="182" font-family="'Playfair Display', Georgia, serif" font-size="28" text-anchor="middle" fill="#744e5d">Redolent</text>
    <text x="130" y="200" font-family="Lato, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9c7a87" opacity="0.9">eau de parfum</text>

    <!-- Glass highlight -->
    <ellipse cx="60" cy="110" rx="90" ry="100" fill="url(#glassHighlight)"/>
    <!-- Specular streaks -->
    <path d="M32,96 C60,70 90,68 120,76" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3" fill="none"/>
    <path d="M48,210 C84,196 120,198 156,210" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" fill="none"/>
  </g>

  <!-- Foreground accents -->
  <g opacity="0.35">
    <path d="M240,860 C360,840 1240,840 1440,860" stroke="#8b4f1f" stroke-width="6" fill="none"/>
    <path d="M220,880 C380,860 1220,860 1460,880" stroke="#9c5d28" stroke-width="4" fill="none"/>
  </g>
</svg>
